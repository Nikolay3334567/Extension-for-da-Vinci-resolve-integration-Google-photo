<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:*; media-src 'self' blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud Pool</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" class="sidebar"></aside>
      <main class="main">
        <header id="toolbar" class="toolbar"></header>
        <div id="selbar" class="selbar"></div>
        <div id="content" class="content">
          <div class="grid-wrap">
            <div id="grid" class="grid-scroller" tabindex="-1"></div>
            <div id="empty" class="empty-state"></div>
            <div id="picker-banner" class="picker-banner"></div>
          </div>
          <div id="splitter" class="splitter"></div>
          <section id="preview" class="preview"></section>
        </div>
        <footer id="statusbar" class="statusbar"></footer>
      </main>
    </div>
    <aside id="drawer" class="drawer"></aside>
    <div id="settings" class="dialog-backdrop"></div>
    <div id="onboarding" class="onboarding"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
